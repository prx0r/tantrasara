name: Factory contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-test.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate checked-in data
        run: python factory_contract.py --all > /tmp/factory-audit.json
      - name: Verify source and overrides without production assets
        run: |
          python - <<'PY'
          import glob
          from factory_contract import verify_storyboard_source
          paths = sorted(glob.glob('storyboard_ch*.json') + glob.glob('shiva/storyboards/storyboard_s*.json'))
          if len(paths) != 100:
              raise SystemExit(f'Expected 100 current units; found {len(paths)}')
          for path in paths:
              verify_storyboard_source(path, check_environment=False)
          print(f'Compared {len(paths)} source storyboards without modifying them')
          PY
      - name: Exercise gates and synthetic media
        run: python -m unittest discover -s tests -v
